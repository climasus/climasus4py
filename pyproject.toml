[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "climasus4py"
version = "0.3.0"
description = "Fast SUS and climate data workflows for Brazil - Python edition"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Marlon Resende Faria", email = "marlon.faria@usp.br" },
    { name = "Thauã Menezes", email = "thaua.menezes@unesp.br" },
    { name = "Dr. Max Anjos", email = "max.anjos@campus.ul.pt" },
    { name = "Andrey Araújo", email = "andreyke.araujo@gmail.com" },
]
maintainers = [
    { name = "Dr. Max Anjos", email = "max.anjos@campus.ul.pt" },
]
keywords = ["datasus", "sus", "climate", "health", "brazil", "epidemiology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "climasus-data>=1.1.0",
    "climasus_readdbc_py>=0.2.1",
    "duckdb>=1.0",
    "pyarrow>=12.0",
    "pandas>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
metadata = []
datasus = ["pysus>=1.0"]
spatial = ["geopandas>=0.14"]
ml = ["xgboost>=2.0"]
polars = ["polars>=0.20"]
excel = ["openpyxl>=3.1"]
all = ["climasus4py[datasus,spatial,ml,polars,excel]"]
dev = [
    "mypy>=1.10",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/climasus/climasus4py"
Repository = "https://github.com/climasus/climasus4py"
"Bug Tracker" = "https://github.com/climasus/climasus4py/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["climasus4py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
