[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "climasus4py"
version = "0.2.0a3"
description = "Fast SUS and climate data workflows for Brazil - Python edition"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Marlon Resende Faria", email = "marlon.faria@usp.br" },
    { name = "Thauã Menezes", email = "thaua.menezes@unesp.br" },
    { name = "Dr. Max Anjos", email = "max.anjos@campus.ul.pt" },
    { name = "Andrey Araújo", email = "andreyke.araujo@gmail.com" },
]
maintainers = [
    { name = "Dr. Max Anjos", email = "max.anjos@campus.ul.pt" },
]
keywords = ["datasus", "sus", "climate", "health", "brazil", "epidemiology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "climasus-data>=0.2.0",
    "climasus_readdbc_py>=0.2.0",
    "duckdb>=1.0",
    "pyarrow>=12.0,<22",
    # Upper bound on pandas/numpy is conservative: pandas 3.x is still in
    # preview and shipped a ``Pandas4Warning`` symbol that broke ABI with
    # numpy in Colab as of 2026-05-24. Revisit when pandas 3.0 ships
    # stable. See CHANGELOG entry for context.
    "pandas>=2.0,<3.0",
    "numpy>=1.26,<3",
    "rich>=13.0",
]

[project.optional-dependencies]
metadata = []
datasus = ["pysus>=1.0"]
spatial = ["geopandas>=0.14"]
ml = ["xgboost>=2.0"]
xgboost = ["xgboost>=2.0", "joblib>=1.3", "scikit-learn>=1.3"]
plot = ["plotnine>=0.12"]
polars = ["polars>=0.20"]
excel = ["openpyxl>=3.1"]
all = ["climasus4py[datasus,spatial,ml,polars,excel,xgboost,plot]"]
dev = [
    "mypy>=1.10",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/climasus/climasus4py"
Repository = "https://github.com/climasus/climasus4py"
"Bug Tracker" = "https://github.com/climasus/climasus4py/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["climasus4py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"climasus4py/utils/data.py" = ["SIM108"]
"tools/*.py" = ["B023", "SIM102", "SIM103", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["requests"]
ignore_missing_imports = true
